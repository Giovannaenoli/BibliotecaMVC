<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autores | Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <main>
        <a th:href="@{/livros}">Voltar ao início</a>
        <h1>Cadastrar autor</h1>
        <p>Informe os dados do autor.</p>

        <form th:object="${autor}" th:action="@{/autores}" method="post">
            <label for="nome">Nome</label>
            <input id="nome" type="text" th:field="*{nome}">

            <label for="nacionalidade">Nacionalidade</label>
            <input id="nacionalidade" type="text" th:field="*{nacionalidade}">

            <label for="obrasPublicadas">Obras publicadas</label>
            <input id="obrasPublicadas" type="text" th:field="*{obrasPublicadas}">

            <button type="submit">Cadastrar</button>
        </form>

        <h2>Autores cadastrados</h2>
        <p th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado ainda.</p>
        <table th:if="${!#lists.isEmpty(autores)}">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Nacionalidade</th>
                    <th>Obras publicadas</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="autor : ${autores}">
                    <td th:text="${autor.nome}"></td>
                    <td th:text="${autor.nacionalidade}"></td>
                    <td th:text="${autor.obrasPublicadas}"></td>
                    <td><a th:href="@{/autores/excluir/{id}(id=${autor.id})}">Excluir</a></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
