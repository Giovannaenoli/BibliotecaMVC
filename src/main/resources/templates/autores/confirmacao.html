<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autor cadastrado | Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <main>
        <h1>Autor cadastrado!</h1>
        <p>Confira os dados recebidos:</p>

        <p><strong>Nome:</strong> <span th:text="${autor.nome}"></span></p>
        <p><strong>Nacionalidade:</strong> <span th:text="${autor.nacionalidade}"></span></p>
        <p><strong>Obras publicadas:</strong></p>
        <p th:text="${autor.obrasPublicadas}"></p>

        <nav aria-label="Opções após o cadastro">
            <a th:href="@{/autores/novo}">Cadastrar outro autor</a>
            <a th:href="@{/livros}">Voltar ao início</a>
        </nav>
    </main>
</body>
</html>
