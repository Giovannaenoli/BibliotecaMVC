<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livro cadastrado | Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <main>
        <h1>Livro cadastrado!</h1>
        <p>Confira os dados recebidos:</p>

        <p><strong>Título:</strong> <span th:text="${livro.titulo}"></span></p>
        <p><strong>Autor:</strong> <span th:text="${livro.autor}"></span></p>
        <p><strong>ISBN:</strong> <span th:text="${livro.isbn}"></span></p>
        <p><strong>Ano de publicação:</strong> <span th:text="${livro.anoPublicacao}"></span></p>

        <nav aria-label="Opções após o cadastro">
            <a th:href="@{/livros/novo}">Cadastrar outro livro</a>
            <a th:href="@{/livros}">Voltar ao início</a>
        </nav>
    </main>
</body>
</html>
